<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Anurag Raut</title>
    <meta
      name="description"
      content="The page you requested was not found on Anurag Raut's portfolio."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #171923;
        background: #fafaf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(560px, 100%);
        padding: 40px;
        border: 1px solid #e5e7f0;
        border-radius: 18px;
        background: #fff;
      }
      span {
        color: #5363ee;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.6px;
      }
      h1 {
        margin: 14px 0 10px;
        font-size: clamp(32px, 7vw, 46px);
        letter-spacing: -2px;
      }
      p {
        margin: 0 0 26px;
        color: #5f6577;
        line-height: 1.7;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      a {
        display: inline-flex;
        align-items: center;
        padding: 11px 16px;
        border-radius: 999px;
        background: #171923;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }
      a.secondary {
        border: 1px solid #dfe2ed;
        background: #fff;
        color: #171923;
      }
      a:focus-visible {
        outline: 3px solid #5363ee;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span>404 / PAGE NOT FOUND</span>
      <h1>This page isn't here.</h1>
      <p>
        The link may be old or the address may have changed. You can return to
        the portfolio or browse the field notes.
      </p>
      <nav aria-label="Recovery links">
        <a href="/">Back to portfolio</a>
        <a class="secondary" href="/blog.html">Read field notes</a>
        <a class="secondary" href="/Anurag-Raut-Resume.pdf">Resume</a>
      </nav>
    </main>
  </body>
</html>
